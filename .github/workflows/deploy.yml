name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:

      # ─── Шаг 1 ───────────────────────────────────────────
      # Скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Шаг 2 ───────────────────────────────────────────
      # Авторизуемся в GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Шаг 3 ───────────────────────────────────────────
      # Собираем образ и пушим в ghcr.io
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chat_frontend:latest

      # ─── Шаг 4 ───────────────────────────────────────────
      # Подключаемся к серверу и обновляем контейнер
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/deploy/app

            # Скачиваем свежий образ
            docker pull ghcr.io/${{ github.repository_owner }}/chat_frontend:latest

            # Перезапускаем только фронтенд
            docker compose up -d --no-deps --force-recreate frontend

            # Удаляем старые образы
            docker image prune -f

            docker compose ps

      # ─── Шаг 5 ───────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frontend-v${{ github.run_number }}
          name: "Frontend Release #${{ github.run_number }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
